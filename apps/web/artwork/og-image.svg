<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Kobrixa — 用程式驅動創意。</title>
  <desc>淡黃色背景上的 Kobrixa 標誌、Basic Plus 程式碼與 EV3 主機插圖。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dad5ca"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#26323d" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#f5f0e7"/>
  <rect x="652" y="30" width="518" height="545" rx="32" fill="url(#grid)"/>
  <g transform="translate(58 48) scale(.12)">
    <rect x="20" y="20" width="472" height="472" rx="104" fill="#2457D6"/>
    <rect x="116" y="108" width="78" height="296" rx="20" fill="#F5F0E7"/>
    <path d="M210 242 312 108h86L278 256l120 148h-86L210 270Z" fill="#F5F0E7"/>
    <rect x="183" y="221" width="56" height="70" rx="16" fill="#E86F3D"/>
  </g>
  <g font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif">
    <text x="132" y="91" fill="#1e2933" font-size="36" font-weight="700" letter-spacing="-1.5">Kobrixa</text>
    <rect x="64" y="177" width="32" height="4" rx="2" fill="#e86f3d"/>
    <text x="109" y="186" font-size="18" fill="#2457d6" font-weight="600" letter-spacing="2">為 EV3 而生的程式環境</text>
    <g fill="#1e2933" font-size="66" font-weight="700" letter-spacing="-2">
      <text x="59" y="306">用程式</text>
      <text x="59" y="410">驅動創意。</text>
    </g>
    <path d="M65 439 Q182 426 313 438" stroke="#e86f3d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <text x="64" y="562" font-size="20" fill="#53606b">Basic Plus · 開源 · 離線優先</text>
    <text x="1138" y="562" text-anchor="end" font-size="20" font-weight="600" fill="#2457d6">kobrixa.com ↗</text>
  </g>
  <g transform="translate(612 145) rotate(-3 260 175)">
    <rect width="512" height="295" rx="16" fill="#fffdfa" filter="url(#shadow)"/>
    <rect width="512" height="295" rx="16" fill="none" stroke="#d5d1c8"/>
    <path d="M0 47H512" stroke="#e4e0d7"/>
    <circle cx="25" cy="24" r="5" fill="#e86f3d"/><circle cx="43" cy="24" r="5" fill="#e6c775"/><circle cx="61" cy="24" r="5" fill="#2457d6"/>
    <text x="88" y="29" font-family="Menlo, monospace" font-size="13" fill="#78828a">hello-ev3.bp</text>
    <g font-family="Menlo, monospace" font-size="19" fill="#1e2933">
      <text x="28" y="90">LCD.Clear()</text>
      <text x="28" y="128">message = <tspan fill="#64864e">&quot;Hello, EV3!&quot;</tspan></text>
      <text x="28" y="166">LCD.Text(<tspan fill="#e86f3d">1, 10, 30, 1,</tspan> message)</text>
      <text x="28" y="204">LCD.Update()</text>
      <text x="28" y="242">Program.Delay(<tspan fill="#e86f3d">2000</tspan>)</text>
    </g>
    <rect x="1" y="261" width="510" height="33" rx="12" fill="#edf1e8"/>
    <text x="24" y="283" font-family="Arial, sans-serif" font-size="13" fill="#4d6c45">✓ Build complete</text>
  </g>
  <g transform="translate(922 352) rotate(8 88 82)">
    <rect width="172" height="161" rx="22" fill="#e8e4da" stroke="#b9beb9" stroke-width="2" filter="url(#shadow)"/>
    <rect x="21" y="19" width="130" height="67" rx="7" fill="#c5d0af" stroke="#8f9b83" stroke-width="2"/>
    <text x="86" y="63" text-anchor="middle" font-family="Menlo, monospace" font-size="27" font-weight="700" fill="#3d4b37">EV3</text>
    <path d="M69 97H103V106H112V132H103V141H69V132H60V106H69Z" fill="#b6bab6"/>
    <rect x="76" y="109" width="20" height="20" rx="4" fill="#e86f3d"/>
    <path d="M24 118L34 110V126Z M148 118L138 110V126Z" fill="#7f8b88"/>
  </g>
</svg>
