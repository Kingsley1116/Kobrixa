name: Stage 3 acceptance

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      b2_run_id:
        description: Run containing actual complete B2 reports (required for dispatched B2 validation)
        type: string
        required: true
      b2_artifact:
        description: Artifact containing persistence.json and single-instance.json plus referenced receipts
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Stage 3 ${{ matrix.gate }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-26]
        gate: [motor, lab, device, installed]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      KOBRIXA_TEST_PYTHON: ${{ matrix.os == 'windows-2022' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner context is not available in job-level env.
      - name: Use the runner temp directory
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inventory exact commands and prerequisites
        run: node tests/desktop/stage-3-closeout-run.mjs ${{ matrix.gate }} --inventory
      - run: pnpm build:core
      - run: pnpm build:desktop
      - name: Configure Electron sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          electron="$(node -e "console.log(require('electron'))" | tail -n 1)"
          sandbox="$(dirname "$electron")/chrome-sandbox"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Allow installed Chromium user namespaces on AppArmor hosts
        if: runner.os == 'Linux' && matrix.gate == 'installed'
        shell: bash
        run: |
          # Landlock sets no_new_privs, so the copied product cannot use a
          # setuid sandbox. Permit Chromium's userns sandbox only at test-copy
          # executable paths; do not disable AppArmor or Chromium's sandbox.
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            node tests/desktop/builtin-installed-linux.mjs --apparmor-profile "$RUNNER_TEMP" > "$RUNNER_TEMP/kobrixa-installed-apparmor.profile"
            sudo apparmor_parser -r "$RUNNER_TEMP/kobrixa-installed-apparmor.profile"
            echo "KOBRIXA_INSTALLED_APPARMOR_LOADED=1" >> "$GITHUB_ENV"
          fi
      - name: Execute required native gate
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            if [ '${{ matrix.gate }}' = installed ]; then
              # A new netns starts with lo DOWN. Keep Xvfb's Unix display socket
              # and auth, bring up only lo, then drop root. sudo's secure_path
              # must not replace the setup-node binary (the old run used Node 22).
              installed_node="$(node -p 'process.execPath')"
              xvfb-run -a sudo --preserve-env=DISPLAY,XAUTHORITY,TMPDIR,TMP,TEMP unshare --net -- /bin/sh -ec '
                /usr/sbin/ip link set lo up
                exec sudo --preserve-env=DISPLAY,XAUTHORITY,TMPDIR,TMP,TEMP -u "$1" -- "$2" tests/desktop/stage-3-closeout-run.mjs installed --run
              ' sh "#$(id -u)" "$installed_node" 2>&1 | tee stage-3-native.log
            else
              xvfb-run -a node tests/desktop/stage-3-closeout-run.mjs '${{ matrix.gate }}' --run 2>&1 | tee stage-3-native.log
            fi
          else
            node tests/desktop/stage-3-closeout-run.mjs '${{ matrix.gate }}' --run 2>&1 | tee stage-3-native.log
          fi
      - name: Retain installed Linux kernel denials and remove test AppArmor profile
        if: always() && runner.os == 'Linux' && matrix.gate == 'installed'
        shell: bash
        run: |
          installed_audit_status=0
          sudo journalctl -k --no-pager -n 2000 > "$RUNNER_TEMP/kobrixa-installed-kernel.log" || installed_audit_status=$?
          if [ "${KOBRIXA_INSTALLED_APPARMOR_LOADED:-}" = 1 ]; then
            sudo apparmor_parser -R "$RUNNER_TEMP/kobrixa-installed-apparmor.profile"
          fi
          exit "$installed_audit_status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage-3-${{ matrix.gate }}-${{ matrix.os }}
          path: |
            stage-3-native.log
            ${{ runner.temp }}/kobrixa-*/**
          if-no-files-found: error
          retention-days: 7
      - name: State remaining evidence scope
        if: always()
        shell: bash
        run: echo 'This job does not sign B2 reports, maximum-load, hardware or human acceptance. Run dispatched B2 validation with actual complete reports.' >> "$GITHUB_STEP_SUMMARY"

  journal-win32:
    name: Windows safety-journal adapter prototype
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build against Electron headers and run the native suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $buildRoot = Join-Path $env:RUNNER_TEMP ('w02a-' + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $buildRoot | Out-Null
          "W02A_BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV
          Copy-Item apps/desktop/native/journal-win32/binding.gyp $buildRoot
          Copy-Item apps/desktop/native/journal-win32/journal.cc $buildRoot
          $electronVersion = (& node -p "require('electron/package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve pinned Electron version' }
          $electron = (& node -e "console.log(require('electron'))" | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron binary is not installed' }
          $nodeGyp = (& node -p "require.resolve('node-gyp/bin/node-gyp.js')").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Frozen install did not expose node-gyp' }
          & node $nodeGyp rebuild "--directory=$buildRoot" "--target=$electronVersion" --arch=x64 --dist-url=https://electronjs.org/headers "--devdir=$buildRoot/headers" 2>&1 | Tee-Object (Join-Path $buildRoot 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native Electron-header build failed' }
          $env:KOBRIXA_JOURNAL_WIN32_ADDON = Join-Path $buildRoot 'build/Release/journal_win32.node'
          $suite = Join-Path $repo 'tests/desktop/journal-win32-native.test.mjs'
          Get-FileHash -Algorithm SHA256 $env:KOBRIXA_JOURNAL_WIN32_ADDON
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $electron --test --test-reporter=tap $suite 2>&1 | Tee-Object (Join-Path $buildRoot 'electron-test.tap')
          if ($LASTEXITCODE -ne 0) { throw 'Windows Electron native suite failed' }
      - name: Retain build log and TAP output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journal-win32-prototype
          path: |
            ${{ env.W02A_BUILD_ROOT }}/build.log
            ${{ env.W02A_BUILD_ROOT }}/electron-test.tap
          if-no-files-found: warn

  b2-reports:
    name: Full B2 supplied report validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.b2_artifact }}
          run-id: ${{ inputs.b2_run_id }}
          github-token: ${{ github.token }}
          path: stage-3-reports
      - name: Validate complete reports (missing or partial is a failure)
        env:
          PERSISTENCE_EVIDENCE: ${{ github.workspace }}/stage-3-reports/persistence.json
          KOBRIXA_SINGLE_INSTANCE_REPORT: ${{ github.workspace }}/stage-3-reports/single-instance.json
        run: node tests/desktop/stage-3-closeout-run.mjs b2 --run
