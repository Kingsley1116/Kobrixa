name: Stage 3 UHID feasibility spike

on:
  push:
    branches: [feat/plugin-system-stage-3]
    paths:
      - .github/workflows/stage-3-uhid-spike.yml
      - tests/desktop/ev3-uhid-spike*.mjs
      - tests/desktop/fixtures/ev3-uhid/**

permissions:
  contents: read

jobs:
  spike:
    name: Hosted Ubuntu UHID feasibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize gate report
        run: |
          dir="$RUNNER_TEMP/uhid-results"
          node tests/desktop/ev3-uhid-spike.mjs init "$dir"
          for key in TMPDIR TMP TEMP; do echo "$key=$RUNNER_TEMP" >> "$GITHUB_ENV"; done
          echo "RESULTS=$dir" >> "$GITHUB_ENV"
          echo "DRIVER=tests/desktop/ev3-uhid-spike.mjs" >> "$GITHUB_ENV"
      - name: G1 kernel prerequisites
        run: node "$DRIVER" G1 "$RESULTS" 2>&1 | tee "$RESULTS/G1.log"
      - name: G2 create peer and provision the matching hidraw node
        run: node "$DRIVER" G2 "$RESULTS" 2>&1 | tee "$RESULTS/G2.log"
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build core and package the production desktop
        run: |
          node node_modules/typescript/bin/tsc -b packages/*/tsconfig.json frontends/*/tsconfig.json
          node --test tests/desktop/ev3-uhid-spike.test.mjs
          node node_modules/electron/install.js
          node tools/release/build-desktop.mjs
        id: build
      - name: G3 packaged node-hid from plain Node
        run: node "$DRIVER" G3 "$RESULTS" 2>&1 | tee "$RESULTS/G3.log"
      - name: Configure Electron sandbox
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: sandbox
        run: |
          electron="$(node -e "console.log(require('electron'))" | tail -n 1)"
          sandbox="$(dirname "$electron")/chrome-sandbox"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Load installed AppArmor profile
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        id: apparmor
        uses: ./.github/actions/installed-apparmor
        with:
          operation: load
      - name: G4 drive the confined packaged app
        if: ${{ !cancelled() && steps.apparmor.outcome == 'success' }}
        run: |
          installed_node="$(node -p 'process.execPath')"
          xvfb-run -a sudo --preserve-env=DISPLAY,XAUTHORITY,TMPDIR,TMP,TEMP unshare --net -- /bin/sh -ec '
            /usr/sbin/ip link set lo up
            exec sudo --preserve-env=DISPLAY,XAUTHORITY,TMPDIR,TMP,TEMP -u "$1" -- "$2" "$3" G4 "$4"
          ' sh "#$(id -u)" "$installed_node" "$DRIVER" "$RESULTS" 2>&1 | tee "$RESULTS/G4.log"
      - name: Retain kernel log and unload installed AppArmor profile
        if: always() && steps.apparmor.outcome == 'success'
        uses: ./.github/actions/installed-apparmor
        with:
          operation: unload
      - name: Retain service state and stop the peer
        if: always() && env.RESULTS != ''
        run: |
          unit=kobrixa-uhid-spike.service
          systemctl show "$unit" -p LoadState -p ActiveState -p Result -p ExecMainStatus > "$RESULTS/service.log"
          if systemctl cat "$unit" >/dev/null 2>&1; then
            sudo systemctl stop "$unit"
          fi
      - name: Report all four gate outcomes
        if: always() && env.RESULTS != ''
        run: node "$DRIVER" result "$RESULTS" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage-3-uhid-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/uhid-results/
            ${{ runner.temp }}/kobrixa-installed-kernel.log
          if-no-files-found: error
          retention-days: 7
