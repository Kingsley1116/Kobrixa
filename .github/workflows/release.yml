name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      signing: ${{ steps.validate.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: validate
        run: node tools/release/github.mjs validate
        env:
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}

  quality:
    name: Common checks
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:common
      - run: pnpm check:desktop

  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/release/github.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODES: ${{ needs.validate.outputs.signing }}

  platform:
    name: Release (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [validate, quality, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            timeout: 30
          # Electron's pinned node-gyp does not support Visual Studio 2026 yet.
          - os: windows-2022
            platform: win32
            arch: x64
            timeout: 180
          - os: macos-26
            platform: darwin
            arch: arm64
            timeout: 90
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: write
      actions: read
    env:
      SIGNING_MODES: ${{ needs.validate.outputs.signing }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      SIGNPATH_CERTIFICATE_SUBJECT: ${{ vars.SIGNPATH_CERTIFICATE_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:core
      - run: pnpm test:desktop
      - name: Import Apple certificate into a temporary keychain
        if: matrix.platform == 'darwin' && fromJSON(needs.validate.outputs.signing).macos
        run: node tools/release/macos-keychain.mjs setup
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Check SignPath configuration
        id: signpath-config
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        run: node tools/release/signing.mjs preflight-windows
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
      - run: pnpm build:desktop
        env:
          KOBRIXA_RELEASE_BUILD: "true"
          APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      - name: Upload temporary unsigned Windows application
        id: unsigned-windows
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        uses: actions/upload-artifact@v4
        with:
          name: signpath-win32-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/out/Kobrixa-win32-x64/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Request SignPath signing (manual approval, up to 60 minutes)
        id: signpath
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/out/signed
          parameters: |
            version: ${{ toJSON(steps.signpath-config.outputs.version) }}
      - name: Verify and accept the signed Windows executable
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        run: node tools/release/signing.mjs accept-windows
      - name: Smoke test the packaged application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:desktop:packaged
          else
            pnpm test:desktop:packaged
          fi
      - run: pnpm package:installers
        env:
          KOBRIXA_RELEASE_BUILD: "true"
      - name: Stage Windows installer for signing
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        run: node tools/release/signing.mjs stage-installer
      - name: Upload temporary unsigned Windows installer
        id: unsigned-installer
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        uses: actions/upload-artifact@v4
        with:
          name: signpath-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/out/unsigned-installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Sign final Windows installer
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/out/signed-installer
          parameters: |
            version: ${{ toJSON(steps.signpath-config.outputs.version) }}
            release-version: ${{ toJSON(steps.signpath-config.outputs.release-version) }}
      - name: Verify signed Windows installer
        if: matrix.platform == 'win32' && fromJSON(needs.validate.outputs.signing).windows
        run: node tools/release/signing.mjs accept-installer
      - run: pnpm package:archive
        env:
          KOBRIXA_RELEASE_BUILD: "true"
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
      - run: pnpm package:updates
        env:
          KOBRIXA_RELEASE_BUILD: "true"
      - run: node tools/release/github.mjs upload
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Remove temporary Apple keychain
        if: always() && matrix.platform == 'darwin' && env.MACOS_KEYCHAIN_PATH != ''
        run: node tools/release/macos-keychain.mjs cleanup
      - name: Report platform result
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}-${{ matrix.arch }}
          RESULT: ${{ job.status }}
        run: echo "$PLATFORM — $RESULT" >> "$GITHUB_STEP_SUMMARY"

  finalize:
    if: always()
    needs: [validate, quality, prepare, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/release/github.mjs finalize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULTS: ${{ toJSON(needs) }}
          SIGNING_MODES: ${{ needs.validate.outputs.signing }}
