name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload development archives and checksums (7 days)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected products
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scope
        run: node tools/ci/changes.mjs

  quality:
    name: Common checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:common

  web:
    name: Website
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:web
      - run: pnpm test:web
      - run: pnpm build:web

  platform:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: Desktop (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          # Electron's pinned node-gyp does not support Visual Studio 2026 yet.
          - os: windows-2022
            platform: win32
            arch: x64
          - os: macos-26
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      KOBRIXA_TEST_PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pnpm check:desktop
      - run: pnpm build:core
      - name: Verify static language schemas and generated core ids
        shell: bash
        run: |
          pnpm --filter @kobrixa/plugin-protocol schema
          node tools/generate-static-language-core-ids.mjs --check
          git diff --exit-code -- packages/plugin-protocol/schema/plugin-protocol.schema.json sdks/python/kobrixa/plugin-protocol.schema.json apps/desktop/src/renderer/editor/core-static-language-ids.json
      - name: Check collaboration service and real two-client sync
        if: runner.os == 'Linux'
        run: pnpm check:collab && pnpm test:collab:live
      - run: pnpm test:desktop
      - name: Static language boundary ledger (P5)
        run: pnpm test:static-languages:boundaries
      - name: Static language IPC, Monaco and recovery smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:static-languages:smoke
          else
            pnpm test:static-languages:smoke
          fi
      - name: Plugin smoke (utilityProcess, Python, crash isolation)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:plugins:smoke
          else
            pnpm test:plugins:smoke
          fi
      - name: Device public transport smoke
        shell: bash
        run: |
          export pnpm_config_pm_on_fail=ignore pnpm_config_verify_deps_before_run=false
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:device-broker:smoke
          else
            pnpm test:device-broker:smoke
          fi
      - run: pnpm build:desktop
      - name: Smoke test the packaged application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:desktop:packaged
          else
            pnpm test:desktop:packaged
          fi
      - run: pnpm package:installers
      - run: pnpm package:archive
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
      - run: pnpm package:updates
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: Kobrixa-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: apps/desktop/out/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [changes, quality, web, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every affected product to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node tools/ci/changes.mjs result
