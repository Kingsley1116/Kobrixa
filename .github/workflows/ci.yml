name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload development archives and checksums (7 days)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected products
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        run: node tools/ci/changes.mjs

  quality:
    name: Common checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:common

  web:
    name: Website
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:web
      - run: pnpm test:web
      - run: pnpm build:web

  platform:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: Desktop (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          # Electron's pinned node-gyp does not support Visual Studio 2026 yet.
          - os: windows-2022
            platform: win32
            arch: x64
          - os: macos-26
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:desktop
      - run: pnpm build:core
      - run: pnpm test:desktop
      - run: pnpm build:desktop
      - run: pnpm package:archive
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        with:
          name: Kobrixa-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: apps/desktop/out/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [changes, quality, web, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require every affected product to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node tools/ci/changes.mjs result
