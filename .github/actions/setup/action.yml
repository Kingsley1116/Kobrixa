name: Setup Kobrixa
description: Install the pinned toolchain, native dependencies and workspace packages
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install Linux native build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update &&
            sudo apt-get -o Acquire::Retries=5 install -y build-essential pkg-config libusb-1.0-0-dev libudev-dev; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::Linux native dependency installation failed after 3 attempts"
            exit 1
          fi
          echo "Retrying Linux native dependency installation in $((attempt * 10)) seconds"
          sleep "$((attempt * 10))"
        done
    - run: pnpm install --frozen-lockfile
      shell: bash
