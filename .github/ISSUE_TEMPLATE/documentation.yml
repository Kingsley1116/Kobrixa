name: Documentation or example
description: Report unclear, incorrect or missing documentation.
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Include the URL or repository path and language.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
      description: English and Chinese are welcome.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Include expected behavior and public references when available.
